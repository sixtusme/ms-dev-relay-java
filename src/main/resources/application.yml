# Propiedades sensibles resueltas vía ${VAR:default}: en local salen del entorno (o quedan
# vacías), en PRE/PROD el pipeline las inyecta desde Vault con el mismo nombre. Este fichero no
# cambia entre entornos y ningún secreto real vive aquí.
spring:
  application:
    name: ms-dev-relay-java

  # Secretos locales opcionales (tokens de Jira, GitHub...). Ignorado por git.
  config:
    import: optional:file:./application-local.yml

  # Puerto 3309: el 3307 lo usa users-java y el 3308 un mysqld nativo de Windows.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3309/sixai?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:developer}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo manda Flyway
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8092

logging:
  level:
    es.colorbaby.microservices.dev.relay: DEBUG
    org.springframework.web: WARN

maestro:
  jira:
    base-url: ${JIRA_BASE_URL:https://colorbaby.atlassian.net}
    email: ${JIRA_EMAIL:sixtus.nosike@metaenlace.com}
    api-token: ${JIRA_API_TOKEN:}
    auth-mode: ${JIRA_AUTH_MODE:CLOUD_BASIC}   # CLOUD_BASIC (Cloud) o SERVER_PAT (Server/DC)
    connect-timeout-ms: ${JIRA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${JIRA_READ_TIMEOUT_MS:10000}

    sync:
      mode: ${MAESTRO_JIRA_SYNC_MODE:POLLING}   # WEBHOOK | POLLING | BOTH
      polling-interval-ms: ${MAESTRO_JIRA_POLLING_INTERVAL_MS:15000}
      # Secreto propio (no de Atlassian); va también como X-Maestro-Webhook-Secret en la
      # automatización de Jira que llama a /api/webhooks/jira.
      webhook-secret: ${MAESTRO_JIRA_WEBHOOK_SECRET:}

    filter:
      # Entrecomillado: el accountId de Cloud lleva ':' y rompe el parseo sin comillas.
      allowed-assignees: "${MAESTRO_JIRA_ALLOWED_ASSIGNEES:712020:68f06d90-a9d3-41e4-949b-9855cad860d6}"
      trigger-keyword: ${MAESTRO_JIRA_TRIGGER_KEYWORD:sixai}
      require-assignee-author: ${MAESTRO_JIRA_REQUIRE_ASSIGNEE_AUTHOR:true}
      trusted-trigger-authors: ${MAESTRO_JIRA_TRUSTED_AUTHORS:}   # accountIds/emails extra, separados por coma
      # Nombres EXACTOS del flujo de Jira, separados por coma. Vacío = sin filtro de estado.
      statuses: "${MAESTRO_JIRA_FILTER_STATUSES:TAREAS EN COLA}"
      # Idempotencia: Sixai la pone al terminar; las tareas que ya la tienen se excluyen del
      # polling y del filtro. Vacío = sin marca.
      processed-label: ${MAESTRO_JIRA_FILTER_PROCESSED_LABEL:sixai-procesada}

  # LLM: cambia de proveedor y modelo sin tocar código. Formato compatible con OpenAI
  # (/v1/chat/completions), que habla Ollama, LM Studio, OpenAI, etc. Por defecto, Ollama local.
  # Anthropic usa otro formato: cuando haga falta, se añade otra implementación de LlmClient.
  llm:
    # Interruptor: apagado, Sixai solo comenta (maestro.responder.ack-comment) sin llamar al modelo.
    enabled: ${MAESTRO_LLM_ENABLED:false}
    provider: ${MAESTRO_LLM_PROVIDER:openai-compatible}   # openai-compatible | anthropic (futuro)
    base-url: ${MAESTRO_LLM_BASE_URL:http://localhost:11434/v1}
    model: "${MAESTRO_LLM_MODEL:qwen3:8b}"
    # Modelo por rol lógico, servido desde Ollama local. Limitado a ~8B por la RAM de esta
    # máquina (16 GB, sin GPU); con un gateway de modelos (LiteLLM) delante, se cambian estos
    # nombres por remotos sin tocar código. Detalle en /ai/gateway-de-modelos.
    models:
      responder: "${MAESTRO_LLM_MODEL_RESPONDER:aya-expanse:8b}"       # multilingüe, buen español
      selector:  "${MAESTRO_LLM_MODEL_SELECTOR:qwen2.5:3b}"            # pequeño: elige repos de una lista
      router:    "${MAESTRO_LLM_MODEL_ROUTER:qwen2.5:3b}"              # pequeño: intención del comando
      planner:   "${MAESTRO_LLM_MODEL_PLANNER:qwen3:8b}"
      coder:     "${MAESTRO_LLM_MODEL_CODER:qwen2.5-coder:7b}"
      diagnose:  "${MAESTRO_LLM_MODEL_DIAGNOSE:qwen3:8b}"
      embedding: "${MAESTRO_LLM_MODEL_EMBEDDING:nomic-embed-text}"     # ~274 MB; para el Knowledge
      reviewer:  "${MAESTRO_LLM_MODEL_REVIEWER:qwen3:8b}"
    api-key: ${MAESTRO_LLM_API_KEY:}   # vacío para Ollama; token del proveedor/gateway cloud
    temperature: ${MAESTRO_LLM_TEMPERATURE:0.4}
    max-tokens: ${MAESTRO_LLM_MAX_TOKENS:1024}   # para los roles que no tengan el suyo
    # Tope de tokens por rol: quedarse corto no da una respuesta más pobre, la corta a media
    # cadena, y al coder (que devuelve ficheros enteros en un JSON) eso le deja los cambios sin
    # parsear y se pierden en silencio.
    max-tokens-by-role:
      coder: ${MAESTRO_LLM_MAX_TOKENS_CODER:16000}
      planner: ${MAESTRO_LLM_MAX_TOKENS_PLANNER:4000}
      diagnose: ${MAESTRO_LLM_MAX_TOKENS_DIAGNOSE:2000}
      responder: ${MAESTRO_LLM_MAX_TOKENS_RESPONDER:1024}
      router: ${MAESTRO_LLM_MAX_TOKENS_ROUTER:200}       # devuelve una palabra del catálogo
      selector: ${MAESTRO_LLM_MAX_TOKENS_SELECTOR:200}   # devuelve una lista de repos
    connect-timeout-ms: ${MAESTRO_LLM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MAESTRO_LLM_READ_TIMEOUT_MS:120000}   # margen amplio: los modelos locales tardan
    # Timeout por rol: el coder genera ficheros enteros y necesita mucho más margen que el
    # router, que devuelve una palabra.
    read-timeout-by-role:
      coder: ${MAESTRO_LLM_READ_TIMEOUT_CODER:300000}
      diagnose: ${MAESTRO_LLM_READ_TIMEOUT_DIAGNOSE:180000}
      planner: ${MAESTRO_LLM_READ_TIMEOUT_PLANNER:180000}
      router: ${MAESTRO_LLM_READ_TIMEOUT_ROUTER:30000}
      selector: ${MAESTRO_LLM_READ_TIMEOUT_SELECTOR:30000}
    # Cortocircuito: si el modelo deja de responder, falla YA en vez de agotar el timeout en
    # cada llamada. Todo lo que usa el LLM tiene alternativa (coder → placeholder, selector/router
    # → palabras clave).
    circuit-failure-rate-threshold: ${MAESTRO_LLM_CIRCUIT_THRESHOLD:50}
    circuit-minimum-calls: ${MAESTRO_LLM_CIRCUIT_MIN_CALLS:5}
    circuit-open-seconds: ${MAESTRO_LLM_CIRCUIT_OPEN_SECONDS:60}
    # Regla clave: primero reformula lo entendido (checkpoint que el cliente puede corregir) y
    # luego responde. No inventa acciones.
    system-prompt: >-
      Eres Sixai, un asistente que responde tareas de Jira del equipo de Colorbaby.
      Te llega el título y la descripción de una tarea. Responde en español, de forma clara y
      profesional, como un comentario de Jira (texto plano, sin markdown pesado).
      Empieza SIEMPRE reformulando en una frase lo que has entendido que se te pide ("He entendido
      que necesitas..."), para que quien la creó pueda confirmarlo o corregirte. Después, da tu
      respuesta o propuesta. Si la petición no está clara o te falta información, dilo y pregunta
      en vez de inventar. No afirmes haber hecho cambios: solo puedes responder con un mensaje.

  # Qué hace Sixai al detectar una tarea elegible: comentar y moverla de estado.
  responder:
    # Debe coincidir EXACTO con el nombre del estado en el flujo de Jira.
    transition-to: ${MAESTRO_RESPONDER_TRANSITION_TO:En curso}
    # Comentario que publica cuando la IA está apagada (maestro.llm.enabled=false).
    ack-comment: >-
      ${MAESTRO_RESPONDER_ACK_COMMENT:Sixai ha recibido esta tarea y la ha puesto en curso. La
      respuesta automática está desactivada por ahora.}
    # Corre toda la tubería (incl. LLM) pero no escribe en Jira; se loguea con [DRY-RUN].
    dry-run: ${MAESTRO_RESPONDER_DRY_RUN:false}
    mention-author: ${MAESTRO_RESPONDER_MENTION_AUTHOR:true}
    quote-comment: ${MAESTRO_RESPONDER_QUOTE_COMMENT:true}
    comment-on-error: ${MAESTRO_RESPONDER_COMMENT_ON_ERROR:true}
    error-label: ${MAESTRO_RESPONDER_ERROR_LABEL:sixai-error}   # vacío = no etiquetar los fallos

  # Al poner una tarea en curso, Sixai abre una draft-PR por cada repo relevante (rama
  # sixai/<ISSUE>-<ts> + commit de arranque). El "cómo hablar con GitHub" (org, token, url,
  # timeouts) lo lee la lib (GithubProperties); el "qué hace" lo lee esta app, mismo prefijo.
  github:
    enabled: ${MAESTRO_GITHUB_ENABLED:false}
    # Loguea las PRs que abriría con prefijo [DRY-RUN], sin crear ramas ni PRs.
    dry-run: ${MAESTRO_GITHUB_DRY_RUN:true}
    org: ${GITHUB_ORG:colorbaby}
    token: ${GITHUB_TOKEN:}
    base-url: ${GITHUB_BASE_URL:https://api.github.com}
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS:15000}
    branch-prefix: ${MAESTRO_GITHUB_BRANCH_PREFIX:sixai/}
    # Rama base de las PRs: develop existe en todos los repos. main/master se reserva para PROD.
    base-branch: ${MAESTRO_GITHUB_BASE_BRANCH:develop}
    # Mapeo sistema -> repos candidatos, por palabra clave en épica/título/clave/labels. De los
    # candidatos, el LLM (si está encendido) o el filtro por keywords decide en cuáles abrir PR.
    projects:
      - keywords: [pim]
        repos:
          - name: mf-pim-react
            role: frontend/UI (React) del PIM
            keywords: [front, frontend, ui, pantalla, vista, css, react, componente, estilo]
          - name: ms-pim-java
            role: backend/servicio del PIM (API REST + consultas SQL)
            keywords: [back, backend, endpoint, api, servicio, sql, query, consulta, delegate]
          - name: ms-pim-lib-java
            role: contrato/spec OpenAPI del PIM (DTOs y rutas)
            keywords: [spec, contrato, dto, openapi, modelo, yaml]
      - keywords: [sixai, dev-relay, maestro]
        repos:
          - name: ms-dev-relay-java
            role: servicio de Sixai
            keywords: [back, backend, servicio, endpoint, api]
          - name: ms-dev-relay-lib-java
            role: contrato/spec OpenAPI de Sixai
            keywords: [spec, contrato, dto, openapi, yaml]
      - keywords: [docs, documentación, documentacion, wiki]
        repos:
          - name: colorbaby-docs-java
            role: backend del portal de documentación
            keywords: [back, backend, servicio, endpoint, api]
          - name: colorbaby-docs-lib-java
            role: contrato/spec OpenAPI de docs
            keywords: [spec, contrato, dto, openapi, yaml]
          - name: colorbaby-docs-react
            role: frontend del portal de documentación
            keywords: [front, frontend, ui, pantalla, vista, react]
          - name: colorbaby-docs-content
            role: contenido markdown de la documentación
            keywords: [contenido, markdown, doc, documento, texto, redacción, redaccion]
      - keywords: [b2b, b2c, portal]
        repos:
          - name: b2b-b2c-java
            role: servicio B2B/B2C
      - keywords: [almacén, almacen, warehouse, pda]
        repos:
          - name: ms-pda-warehouse-java
            role: servicio de almacén (PDA)
      - keywords: [usuarios, users, auth, autenticación, autenticacion]
        repos:
          - name: users-java
            role: servicio de usuarios y autenticación
      - keywords: [gateway]
        repos:
          - name: security-gateway-java
            role: API gateway (Spring Cloud Gateway)

  # Antes de que el coder escriba nada: entiende la tarea, mira el árbol del repo (y el
  # Knowledge) y decide un plan. Solo lectura. Requiere maestro.llm.enabled=true; apagado, el
  # coder decide por su cuenta.
  planner:
    enabled: ${MAESTRO_PLANNER_ENABLED:false}
    tree-max-entries: ${MAESTRO_PLANNER_TREE_MAX_ENTRIES:300}

  # Genera el código real de la tarea en la rama de la PR, en dos pasadas: 1) qué ficheros leer;
  # 2) los cambios en JSON, commiteados por upsert. Requiere maestro.llm.enabled=true. Salida de
  # PRIMER BORRADOR: va a una draft-PR que un humano aprueba antes del merge.
  coder:
    enabled: ${MAESTRO_CODER_ENABLED:false}   # con false, la PR lleva solo el placeholder
    dry-run: ${MAESTRO_CODER_DRY_RUN:true}   # genera y loguea los cambios, sin commitear
    max-context-files: ${MAESTRO_CODER_MAX_CONTEXT_FILES:8}
    max-file-chars: ${MAESTRO_CODER_MAX_FILE_CHARS:8000}
    tree-max-entries: ${MAESTRO_CODER_TREE_MAX_ENTRIES:300}
    max-changes: ${MAESTRO_CODER_MAX_CHANGES:15}
    # Entrecomillado: el valor lleva ": " y sin comillas YAML lo lee como un mapa.
    commit-message-prefix: '${MAESTRO_CODER_COMMIT_PREFIX:feat(sixai): }'

  # Retrieval semántico sobre resources/docs/*.md (embedding por fichero, sin trocear). El coder
  # lo consulta antes de generar cambios, para tener contexto de arquitectura sin volcar toda la
  # documentación en el prompt. Requiere maestro.llm.enabled=true.
  knowledge:
    enabled: ${MAESTRO_KNOWLEDGE_ENABLED:false}
    documents-location: ${MAESTRO_KNOWLEDGE_DOCUMENTS_LOCATION:classpath:docs/*.md}
    max-results: ${MAESTRO_KNOWLEDGE_MAX_RESULTS:5}
    min-score: ${MAESTRO_KNOWLEDGE_MIN_SCORE:0.5}   # similitud coseno mínima (0..1)

  # Lee (nunca toca) lo que el coder acaba de commitear y comenta un veredicto de calidad en la
  # tarea. Es una opinión más para quien aprueba, nunca un bloqueo. Requiere maestro.llm.enabled=true.
  reviewer:
    enabled: ${MAESTRO_REVIEWER_ENABLED:false}
    max-files: ${MAESTRO_REVIEWER_MAX_FILES:10}
    max-file-chars: ${MAESTRO_REVIEWER_MAX_FILE_CHARS:8000}

  # Comandos dirigidos (/sixai · @sixai): en una tarea ya arrancada, un comentario con ese
  # prefijo es una ORDEN que interpreta el LLM (rol router) contra una lista cerrada de
  # intenciones; lo que no encaja pide aclaración, nunca improvisa. Ver /ai/ciclo-de-vida-y-comandos.
  # Idempotencia propia: cada comentario se atiende una sola vez y se ignoran los anteriores al
  # arranque del servicio (mejor perder una orden que reejecutar una vieja).
  command:
    enabled: ${MAESTRO_COMMAND_ENABLED:false}
    dry-run: ${MAESTRO_COMMAND_DRY_RUN:true}   # interpreta y loguea la intención, sin actuar
    prefixes: ${MAESTRO_COMMAND_PREFIXES:/,@}
    # Estados EXACTOS de Jira donde se aceptan comandos: en TEST es promoción/consulta, en "En
    # curso" es corrección.
    statuses: ${MAESTRO_COMMAND_STATUSES:En curso,TEST}
    # Permiso extra para pasar a PROD, además del informador y el asignado. Lista corta y auditada.
    promote-authorized: ${MAESTRO_COMMAND_PROMOTE_AUTHORIZED:}

  # Guardarraíles de entrada y salida: Sixai mete en el prompt cosas que no controla (consolas de
  # Jenkins, logs, comentarios de Jira), con riesgo de fuga de secretos e inyección de
  # instrucciones. Esto es UNA CAPA MÁS, no la defensa principal — la defensa real es que la
  # salida se valide contra catálogos cerrados y que pasar a PROD dependa de la identidad de
  # quien comenta, no del texto. Por eso viene todo encendido por defecto.
  guardrails:
    enabled: ${MAESTRO_GUARDRAILS_ENABLED:true}
    redact-secrets: ${MAESTRO_GUARDRAILS_REDACT:true}   # enmascara secretos entrando y saliendo
    shield-prompts: ${MAESTRO_GUARDRAILS_SHIELD:true}   # marca el contenido externo como dato, no orden
    validate-change-sets: ${MAESTRO_GUARDRAILS_VALIDATE_CHANGESETS:true}
    max-file-bytes: ${MAESTRO_GUARDRAILS_MAX_FILE_BYTES:200000}
    max-untrusted-chars: ${MAESTRO_GUARDRAILS_MAX_UNTRUSTED:20000}
    # Rutas que el coder no puede tocar: quien edita la CI ejecuta lo que quiera con las
    # credenciales del pipeline, y una clave no se edita, se rota.
    denied-paths: ${MAESTRO_GUARDRAILS_DENIED:.github/workflows/,.github/actions/,Jenkinsfile,.env,.pem,.key,.p12,.jks,id_rsa,id_ed25519,credentials}

  # Acceso de solo lectura a las máquinas, para mirar logs/estado de contenedores cuando un
  # despliegue falla. Catálogo de comandos cerrado (logs e inspect); usa credencial de mínimo
  # privilegio.
  infra:
    username: ${INFRA_SSH_USER:}
    password: ${INFRA_SSH_PASSWORD:}
    private-key-path: ${INFRA_SSH_KEY:}
    port: ${INFRA_SSH_PORT:22}
    strict-host-checking: ${INFRA_SSH_STRICT_HOST:false}
    command-timeout-seconds: ${INFRA_SSH_TIMEOUT:30}

  # La consola de Jenkins casi nunca dice por qué se cayó un despliegue: la causa suele estar en
  # el gate de Trivy (Harbor) o en el contenedor que no arranca. Esto le dice a sixai dónde
  # mirar. Los hosts salen del inventario real de Ansible (fixed_target_host de cada rol).
  diagnostician:
    enabled: ${MAESTRO_DIAGNOSTICIAN_ENABLED:false}
    check-harbor-scan: ${MAESTRO_DIAGNOSTICIAN_HARBOR:true}
    read-container-logs: ${MAESTRO_DIAGNOSTICIAN_LOGS:true}
    log-lines: ${MAESTRO_DIAGNOSTICIAN_LOG_LINES:200}
    container-pattern: ${MAESTRO_DIAGNOSTICIAN_CONTAINER:'{service}-container'}   # como en Ansible
    hosts:
      PRE: ${MAESTRO_HOST_PRE:devops03}
      PROD: ${MAESTRO_HOST_PROD:devops04}
      DINAHOSTING: ${MAESTRO_HOST_DINAHOSTING:dinahosting}

  # Ciclo de vida explícito de cada tarea: fase → gate → evidencia. Con enforce=false solo
  # registra y avisa (LIFECYCLE_VIOLATION) de lo que el modo estricto habría bloqueado; con true,
  # bloquea. Se pasa a true cuando los avisos lleven tiempo sin aparecer.
  lifecycle:
    enforce: ${MAESTRO_LIFECYCLE_ENFORCE:false}

  # Cierra el bucle: si el cliente dice que algo está mal (/sixai …) o un despliegue a PRE falla,
  # sixai vuelve a trabajar. Cada intento abre PRs nuevas y vuelve a pasar por aprobación humana
  # → PRE → TEST. max-cycles evita quemar CI en bucle; al agotarse, sixai para y escala a una
  # persona. Un fallo en PRODUCCIÓN nunca se auto-corrige.
  correction:
    enabled: ${MAESTRO_CORRECTION_ENABLED:false}
    dry-run: ${MAESTRO_CORRECTION_DRY_RUN:true}
    max-cycles: ${MAESTRO_CORRECTION_MAX_CYCLES:3}
    auto-fix-on-failure: ${MAESTRO_CORRECTION_AUTO_FIX:true}   # si un fallo de PRE dispara la corrección sola

  # Al arrancar la resolución de una tarea se crea /reports/<CODIGO>-<titulo> con los adjuntos
  # originales; al terminar el coder, se publica ahí el informe .md. Cada fichero se indexa en
  # BD: el panel lista contra la base y solo baja el contenido al abrir uno. Reutiliza el
  # FTP/SFTP que ya existe para otros proyectos (misma forma que ms-aduana-java).
  reports:
    enabled: ${MAESTRO_REPORTS_ENABLED:false}
    protocol: ${MAESTRO_REPORTS_PROTOCOL:sftp}   # sftp | ftp
    host: ${MAESTRO_REPORTS_HOST:localhost}
    port: ${MAESTRO_REPORTS_PORT:2222}
    username: ${MAESTRO_REPORTS_USERNAME:}
    password: ${MAESTRO_REPORTS_PASSWORD:}
    base-directory: ${MAESTRO_REPORTS_BASE_DIR:/reports}
    connect-timeout-ms: ${MAESTRO_REPORTS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${MAESTRO_REPORTS_READ_TIMEOUT_MS:60000}
    strict-host-checking: ${MAESTRO_REPORTS_STRICT_HOST:false}

  # Cuando el front /sixai aprueba una issue, sixai mergea sus PRs a develop y, cuando ese build
  # despliega a PRE, reasigna la tarea al informador y la pasa a TEST. Requiere también
  # maestro.jenkins (observar el build) y maestro.github (merge). Ver /ai/ciclo-de-vida-y-comandos.
  approval:
    enabled: ${MAESTRO_APPROVAL_ENABLED:false}
    dry-run: ${MAESTRO_APPROVAL_DRY_RUN:true}   # loguea qué PRs mergearía, sin tocar nada
    test-status: ${MAESTRO_APPROVAL_TEST_STATUS:TEST}   # estado EXACTO tras desplegar a PRE
    merge-method: ${MAESTRO_APPROVAL_MERGE_METHOD:squash}   # merge | squash | rebase

  # Jenkins: solo el "cómo hablar con él". El token es un API token de usuario (no la
  # contraseña); se inyecta por entorno en local y desde Vault en prod.
  jenkins:
    base-url: ${JENKINS_BASE_URL:}
    user: ${JENKINS_USER:}
    api-token: ${JENKINS_API_TOKEN:}
    connect-timeout-ms: ${JENKINS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${JENKINS_READ_TIMEOUT_MS:15000}

  # Harbor: el registro de imágenes. Sixai lo consulta para saber con qué VERSION quedó
  # etiquetada la imagen que acaba de construir el build (la necesita el job de deploy).
  harbor:
    base-url: ${HARBOR_BASE_URL:https://harbor.colorbaby.es}
    project: ${HARBOR_PROJECT:colorbaby}
    user: ${HARBOR_USER:}
    password: ${HARBOR_PASSWORD:}
    connect-timeout-ms: ${HARBOR_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HARBOR_READ_TIMEOUT_MS:15000}

  # Verifica que la rama de una PR compila antes de aprobarla, usando los MISMOS jobs que el
  # despliegue (maestro.deploy.build-jobs y .repos) pero con FAST_SNAPSHOT_BUILD=true: compila
  # sin crear tag release/X.Y.Z ni empujar a la rama.
  verification:
    enabled: ${MAESTRO_VERIFICATION_ENABLED:false}
    dry-run: ${MAESTRO_VERIFICATION_DRY_RUN:true}
    # No bloquea por defecto: el valor está en que quien aprueba lo VEA, no en atascar la
    # entrega cuando el que falla es Jenkins y no el código.
    block-approval: ${MAESTRO_VERIFICATION_BLOCK:false}
    poll-interval-ms: ${MAESTRO_VERIFICATION_POLL_INTERVAL_MS:30000}
    max-attempts: ${MAESTRO_VERIFICATION_MAX_ATTEMPTS:60}   # por etapa, se reinicia de cola a build
    diagnose-on-failure: ${MAESTRO_VERIFICATION_DIAGNOSE:true}
    console-max-chars: ${MAESTRO_VERIFICATION_CONSOLE_MAX_CHARS:8000}

  # Calcado del pipeline real de Colorbaby: build y deploy son DOS jobs parametrizados.
  #   back/front/back_library_pipeline: compilan REPOSITORY+BRANCH y publican en Harbor.
  #   deploy_pipeline: despliega SERVICE+VERSION en un ENVIRONMENT (PRE=devops03, PROD=devops04).
  # Sixai encadena: build → espera → resuelve VERSION en Harbor → deploy → espera. Un repo que no
  # esté en `repos` no es desplegable por este pipeline. b2b2c es la excepción: su PROD vive en
  # Dinahosting con job propio. Ver /ai/ciclo-de-vida-y-comandos.
  deploy:
    enabled: ${MAESTRO_DEPLOY_ENABLED:false}
    dry-run: ${MAESTRO_DEPLOY_DRY_RUN:true}   # loguea qué jobs lanzaría, sin tocar Jenkins
    deploy-job: ${MAESTRO_DEPLOY_JOB:job/deploy_pipeline}
    build-jobs:
      back: ${MAESTRO_DEPLOY_JOB_BACK:job/back_pipeline}
      front: ${MAESTRO_DEPLOY_JOB_FRONT:job/front_pipeline}
      library: ${MAESTRO_DEPLOY_JOB_LIBRARY:job/back_library_pipeline}
    poll-interval-ms: ${MAESTRO_DEPLOY_POLL_INTERVAL_MS:30000}   # 30s * 60 ≈ 30 min de margen
    max-attempts: ${MAESTRO_DEPLOY_MAX_ATTEMPTS:60}
    # Si un job falla y el LLM está activo, se le manda la cola de la consola. La consola puede
    # arrastrar secretos; la redacción es cosa del gateway de modelos, no de aquí.
    diagnose-on-failure: ${MAESTRO_DEPLOY_DIAGNOSE_ON_FAILURE:true}
    console-max-chars: ${MAESTRO_DEPLOY_CONSOLE_MAX_CHARS:12000}
    # Repos desplegables: pipeline de build, nombre del servicio en Harbor/Ansible y destino PROD.
    repos:
      # PIM nuevo. Convive con el antiguo (pim-back-php / pim-front-typescript): aplicaciones
      # distintas, con puertos y dominios propios.
      - name: ms-pim-java
        pipeline: back
      - name: mf-pim-react
        pipeline: front
      - name: colorbaby-docs-java
        pipeline: back
      - name: colorbaby-docs-react
        pipeline: front
      - name: security-gateway-java
        pipeline: back
      - name: users-java
        pipeline: back
      - name: ms-aduana-java
        pipeline: back
      - name: mf-aduana-react
        pipeline: front
      - name: ms-pda-orders-java
        pipeline: back
      - name: mf-pda-orders-react
        pipeline: front
      - name: ms-pda-warehouse-java
        pipeline: back
      - name: ms-pda-warehouse-react
        pipeline: front
      - name: middleware-sga-java
        pipeline: back
      - name: middleware-sga-react
        pipeline: front
      - name: batches-java
        pipeline: back
      - name: intranet-php
        pipeline: back
      - name: pim-back-php
        pipeline: back
      - name: pim-front-typescript
        pipeline: front
      # b2b2c: su producción está en Dinahosting, con job propio.
      - name: b2b-b2c-java
        pipeline: back
        prod-environment: DINAHOSTING
        prod-job: job/deploy_dinahosting_pipeline
      - name: b2b-b2c-react
        pipeline: front
        prod-environment: DINAHOSTING
        prod-job: job/deploy_dinahosting_pipeline

  # Reservado para módulos futuros (workflow / claude-code con acceso a Obsidian vía el
  # CLAUDE.md de cada repo): mismo prefijo maestro.*, misma resolución env-var -> Vault en prod.
